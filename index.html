<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFB Companion</title>
<meta name="description" content="Ability, archetype, and scheme lookup for college football recruiting.">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CFB Companion">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <h1>CFB Companion</h1>
</header>
<nav class="tabs">
  <button class="tab-btn active" data-view="abilities">Abilities</button>
  <button class="tab-btn" data-view="archetypes">Archetypes</button>
  <button class="tab-btn" data-view="schemes">Schemes</button>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme">&#9680;</button>
</nav>

<main>
  <section id="abilities-view" class="view">
    <div class="controls">
      <div class="search-wrap">
        <input id="ability-search" type="search" placeholder="Search abilities..." autocomplete="off">
        <button class="search-clear" id="ability-search-clear" aria-label="Clear search">&times;</button>
      </div>
      <div class="filter-row" id="type-filters"></div>
      <div class="filter-row" id="tag-filters"></div>
      <button class="clear-filters-btn" id="ability-clear-filters">Clear filters</button>
    </div>
    <div id="ability-results-count" class="results-count"></div>
    <div id="ability-list" class="ability-list"></div>
  </section>

  <section id="archetypes-view" class="view hidden">
    <div class="controls">
      <div class="search-wrap">
        <input id="archetype-search" type="search" placeholder="Search archetypes..." autocomplete="off">
        <button class="search-clear" id="archetype-search-clear" aria-label="Clear search">&times;</button>
      </div>
      <div class="filter-row" id="position-filters"></div>
      <button class="clear-filters-btn" id="archetype-clear-filters">Clear filters</button>
    </div>
    <div id="archetype-results-count" class="results-count"></div>
    <div id="archetype-list" class="archetype-list"></div>
  </section>

  <section id="schemes-view" class="view hidden">
    <div class="controls">
      <div class="search-wrap">
        <input id="scheme-search" type="search" placeholder="Search schemes, or describe what you want to run..." autocomplete="off">
        <button class="search-clear" id="scheme-search-clear" aria-label="Clear search">&times;</button>
      </div>
      <div class="filter-label">What do you want to run?</div>
      <div class="filter-row" id="intent-filters"></div>
      <div class="filter-row" id="side-filters"></div>
      <div class="filter-row" id="scheme-position-filters"></div>
      <button class="clear-filters-btn" id="scheme-clear-filters">Clear filters</button>
    </div>
    <div id="scheme-results-count" class="results-count"></div>
    <div id="scheme-list" class="scheme-list"></div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
